name: Auto Merge Task Branches to Main

on:
  push:
    branches:
      - 'feature/**'
      - 'task/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install & Build Check
        run: |
          npm ci
          npm run build

      - name: Create and Merge PR
        uses: repo-sync/pull-request@v2
        with:
          destination_branch: "main"
          pr_title: "ci: auto-merge ${GITHUB_REF_NAME} into main"
          pr_body: "Automated PR created by GitHub Actions after successful build check."
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --merge "${GITHUB_REF_NAME}" || git checkout main && git merge "origin/${GITHUB_REF_NAME}" && git push origin main
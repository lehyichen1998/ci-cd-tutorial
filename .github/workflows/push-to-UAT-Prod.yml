name: Validate, Push Branches, and Deploy to Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write      # Required for GitHub Pages
  id-token: write   # Required for security token authentication

jobs:
  validate-sync-and-deploy:
    runs-on: ubuntu-latest
    environment: DEV # Pulls your DEV environment secrets (NAME, EMAIL)

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }} # Ensures push permissions across branches

      # --- STEP 1: SET UP NODE ENVIRONMENT ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # --- STEP 2: INSTALL DEPENDENCIES ---
      - name: Install Dependencies
        run: npm ci

      # --- STEP 3: RUN TESTS (Optional/Recommended) ---
      # - name: Run Tests
      #   run: npm test

      # --- STEP 4: BUILD APPLICATION ---
      - name: Build Project
        env:
          VITE_SECRET_NAME: ${{ secrets.NAME }}
          VITE_SECRET_EMAIL: ${{ secrets.EMAIL }}
        run: npm run build

      # --- STEP 5: DEPLOY TO GITHUB PAGES ---
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true # Forces GitHub Pages source to GitHub Actions (bypasses Jekyll)

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # --- STEP 6: SYNC BRANCHES ---
      - name: Configure Git User
        run: |
          git config user.name "${{ secrets.NAME }}"
          git config user.email "${{ secrets.EMAIL }}"

      - name: Push to UAT branch
        run: |
          git checkout -B UAT
          git push origin UAT --force

      - name: Push to Prod branch
        run: |
          git checkout main
          git checkout -B Prod
          git push origin Prod --force
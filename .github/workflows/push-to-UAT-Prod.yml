name: Validate and Push Main to UAT and Prod

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- STEP 1: SET UP NODE ENVIRONMENT ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # --- STEP 2: INSTALL DEPENDENCIES ---
      - name: Install Dependencies
        run: npm ci

      # --- STEP 3: RUN TESTS (Optional/Recommended) ---
      # - name: Run Tests
      #   run: npm test 

      # --- STEP 4: BUILD APPLICATION ---
      - name: Build Project
        env:
            VITE_SECRET_NAME: ${{ secrets.NAME }}
            VITE_SECRET_EMAIL: ${{ secrets.EMAIL }}
        run: npm run build

      # --- STEP 5: SYNC BRANCHES (Only executes if Steps 2-4 succeed) ---
      - name: Configure Git User
        run: |
          git config user.name "${{ secrets.NAME }}"
          git config user.email "${{ secrets.EMAIL }}"

      - name: Push to UAT branch
        run: |
          git checkout -B UAT
          git push origin UAT --force

      - name: Push to Prod branch
        run: |
          git checkout main
          git checkout -B Prod
          git push origin Prod --force
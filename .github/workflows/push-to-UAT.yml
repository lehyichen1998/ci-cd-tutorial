name: Push Main to UAT

on:
  push:
    branches:
      - main

permissions:
  contents: write
  
jobs:
  sync-to-uat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so branches can be merged smoothly

      - name: Configure Git User
        run: |
          git config user.name "lehyichen1998"
          git config user.email "lehyichen1998@gmail.com"

      - name: Push to UAT branch
        run: |
          git checkout -B UAT
          git push origin UAT --force

      - name: Push to Prod branch
        run: |
          git checkout -B Prod
          git push origin Prod --force